name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt 'pytest>=8.4,<9' 'pytest-asyncio>=1.1,<2'
      - run: pytest -q
      - run: docker compose -f docker-compose.yml config --quiet
