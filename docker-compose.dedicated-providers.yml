# Optional performance topology. Apply this file on top of docker-compose.yml to
# give each cognitive role its own Ollama server and model scheduler:
#   docker compose -f docker-compose.yml -f docker-compose.dedicated-providers.yml up --build -d
#
# The base stack remains a safer shared-provider default. This topology can keep
# three model instances resident, so make sure the host has enough GPU/CPU memory.

services:
  ollama-left:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: ${DEDICATED_OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks: [cognition]

  ollama-right:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: ${DEDICATED_OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks: [cognition]

  ollama-executive:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: ${DEDICATED_OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks: [cognition]

  left-model:
    environment:
      MODEL_BASE_URL: ${LEFT_MODEL_BASE_URL:-http://ollama-left:11434/v1}
    depends_on:
      ollama-left:
        condition: service_healthy

  right-model:
    environment:
      MODEL_BASE_URL: ${RIGHT_MODEL_BASE_URL:-http://ollama-right:11434/v1}
    depends_on:
      ollama-right:
        condition: service_healthy

  executive-model:
    environment:
      MODEL_BASE_URL: ${EXEC_MODEL_BASE_URL:-http://ollama-executive:11434/v1}
    depends_on:
      ollama-executive:
        condition: service_healthy
