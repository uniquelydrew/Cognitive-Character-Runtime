name: cognitive-character-runtime

services:
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    # This is a local desktop runtime. Do not publish the management UI on the
    # LAN by default; an authenticated reverse proxy is required for any remote
    # deployment.
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?Set API_AUTH_TOKEN to a long random value in .env before starting the stack.}
    depends_on:
      orchestrator:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [cognition]

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    environment:
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?Set API_AUTH_TOKEN to a long random value in .env before starting the stack.}
      MEMORY_URL: http://memory:8000
      LEFT_URL: http://left-model:8000
      RIGHT_URL: http://right-model:8000
      EXEC_URL: http://executive-model:8000
      WORKER_REQUEST_TIMEOUT_SECONDS: ${WORKER_REQUEST_TIMEOUT_SECONDS:-90}
      TURN_TIMEOUT_SECONDS: ${TURN_TIMEOUT_SECONDS:-240}
      SESSION_QUEUE_TIMEOUT_SECONDS: ${SESSION_QUEUE_TIMEOUT_SECONDS:-15}
      MAX_CONCURRENT_TURNS: ${MAX_CONCURRENT_TURNS:-2}
      MAX_LOBE_TRANSCRIPT_EVENTS: ${MAX_LOBE_TRANSCRIPT_EVENTS:-10}
      MAX_LOBE_TRANSCRIPT_CHARS: ${MAX_LOBE_TRANSCRIPT_CHARS:-6000}
      MAX_LOBE_TRANSCRIPT_EVENT_CHARS: ${MAX_LOBE_TRANSCRIPT_EVENT_CHARS:-1200}
      SEMANTIC_EMBEDDING_URL: ${SEMANTIC_EMBEDDING_URL:-http://ollama:11434/api/embed}
      SEMANTIC_EMBEDDING_MODEL: ${SEMANTIC_EMBEDDING_MODEL:-${OLLAMA_EMBED_MODEL:-all-minilm}}
      SEMANTIC_EMBEDDING_TIMEOUT_SECONDS: ${SEMANTIC_EMBEDDING_TIMEOUT_SECONDS:-8}
      SEMANTIC_REPEAT_SIMILARITY_THRESHOLD: ${SEMANTIC_REPEAT_SIMILARITY_THRESHOLD:-0.80}
      SEMANTIC_REPEAT_MAX_CANDIDATES: ${SEMANTIC_REPEAT_MAX_CANDIDATES:-12}
      REFLECTION_RETRY_POLL_SECONDS: ${REFLECTION_RETRY_POLL_SECONDS:-30}
      ENABLE_DEBUG_API: ${ENABLE_DEBUG_API:-false}
    ports:
      - "127.0.0.1:8080:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      memory:
        condition: service_healthy
      left-model:
        condition: service_healthy
      right-model:
        condition: service_healthy
      executive-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [cognition]

  memory:
    build:
      context: .
      dockerfile: services/memory/Dockerfile
    environment:
      MEMORY_DATABASE: /data/cognition.db
      CHARACTER_DIR: /characters
      KNOWLEDGE_DIR: /knowledge
    volumes:
      - cognition-data:/data
      # Profile Studio persists validated primers here. Runtime conversation state
      # remains in the separate cognition-data volume.
      - ./characters:/characters
      # General knowledge remains separate from conversation state. Only the
      # authenticated Knowledge Studio routes can write its validated catalog;
      # cognitive workers and model output never receive a write path.
      - ./knowledge:/knowledge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [cognition]

  # Ollama is the live local-model provider. Model weights persist in a named volume.
  ollama:
    build:
      context: .
      dockerfile: services/ollama/Dockerfile
    volumes:
      - ollama-models:/home/ollama/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks: [cognition]

  # Pull once before any cognitive worker declares itself ready. Override OLLAMA_MODEL
  # in .env to select another locally supported instruct model.
  ollama-init:
    build:
      context: .
      dockerfile: services/ollama/Dockerfile
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      # The compact embedding model is used only for bounded non-exact repeat
      # checks. It is not part of a character's general-knowledge corpus.
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-all-minilm}
    entrypoint: ["/bin/sh", "-ec", "ollama pull \"$$OLLAMA_MODEL\"; ollama pull \"$$OLLAMA_EMBED_MODEL\""]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks: [cognition]

  left-model:
    build:
      context: .
      dockerfile: services/cognitive_worker/Dockerfile
    environment:
      COGNITIVE_ROLE: left
      MODEL_BASE_URL: ${LEFT_MODEL_BASE_URL:-http://ollama:11434/v1}
      MODEL_NAME: ${LEFT_MODEL_NAME:-${OLLAMA_MODEL:-llama3.2:3b}}
      MODEL_API_KEY: ${LEFT_MODEL_API_KEY:-unused}
      MODEL_TIMEOUT_SECONDS: ${LEFT_MODEL_TIMEOUT_SECONDS:-40}
      MODEL_MAX_TOKENS: ${LEFT_MODEL_MAX_TOKENS:-160}
      MODEL_OUTPUT_ATTEMPTS: ${LEFT_MODEL_OUTPUT_ATTEMPTS:-2}
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [cognition]

  right-model:
    build:
      context: .
      dockerfile: services/cognitive_worker/Dockerfile
    environment:
      COGNITIVE_ROLE: right
      MODEL_BASE_URL: ${RIGHT_MODEL_BASE_URL:-http://ollama:11434/v1}
      MODEL_NAME: ${RIGHT_MODEL_NAME:-${OLLAMA_MODEL:-llama3.2:3b}}
      MODEL_API_KEY: ${RIGHT_MODEL_API_KEY:-unused}
      MODEL_TIMEOUT_SECONDS: ${RIGHT_MODEL_TIMEOUT_SECONDS:-40}
      MODEL_MAX_TOKENS: ${RIGHT_MODEL_MAX_TOKENS:-160}
      MODEL_OUTPUT_ATTEMPTS: ${RIGHT_MODEL_OUTPUT_ATTEMPTS:-2}
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [cognition]

  executive-model:
    build:
      context: .
      dockerfile: services/cognitive_worker/Dockerfile
    environment:
      COGNITIVE_ROLE: executive
      MODEL_BASE_URL: ${EXEC_MODEL_BASE_URL:-http://ollama:11434/v1}
      MODEL_NAME: ${EXEC_MODEL_NAME:-${OLLAMA_MODEL:-llama3.2:3b}}
      MODEL_API_KEY: ${EXEC_MODEL_API_KEY:-unused}
      MODEL_TIMEOUT_SECONDS: ${EXEC_MODEL_TIMEOUT_SECONDS:-40}
      MODEL_MAX_TOKENS: ${EXEC_MODEL_MAX_TOKENS:-220}
      # Repeated questions receive a separate Executive-only intent assessment
      # followed by a speaking pass, while immediate exact repeats still skip
      # the two lobe calls.
      MODEL_REPEAT_MAX_TOKENS: ${EXEC_REPEAT_MAX_TOKENS:-360}
      MODEL_REPEAT_TEMPERATURE: ${EXEC_REPEAT_TEMPERATURE:-0.32}
      MODEL_OUTPUT_ATTEMPTS: ${EXEC_MODEL_OUTPUT_ATTEMPTS:-2}
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [cognition]

volumes:
  cognition-data:
  ollama-models:

networks:
  cognition:
    driver: bridge
