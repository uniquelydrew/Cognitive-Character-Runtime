# General Knowledge Catalog
#
# This is a complete, valid schema example for Knowledge Studio. Download it
# from the UI when starting a new setting, then replace the example IDs and
# assertions with source-supported facts. Classification IDs are lower-case,
# dot-separated labels. A character can receive only records whose access rule
# is satisfied by that character's derived background and connection labels.

classifications:
  - id: access.public
    aliases:
      - public knowledge
      - common knowledge
    description: Information that any character may receive when it is relevant.
  - id: place.example_town
    aliases:
      - Example Town
    description: A location label derived from a character's birthplace.
  - id: community.example_staff
    aliases:
      - example staff
    description: A group or affiliation available only to connected characters.
  - id: role.example_officer
    parents:
      - community.example_staff
    aliases:
      - example officer
    description: A role that inherits its staff-community access.
  - id: domain.example_subject
    aliases:
      - example subject
    description: A topic label used to retrieve records relevant to a question.

records:
  - id: example_town.public_fact
    labels:
      - place.example_town
      - domain.example_subject
    access:
      require_all:
        - access.public
        - place.example_town
      require_any: []
    assertions:
      - Replace this with a stable setting fact supported by an in-world source.
    epistemic_type: fact
    confidence: 1.0
    source: Example Town public notice
  - id: example_town.staff_procedure
    labels:
      - community.example_staff
      - domain.example_subject
    access:
      require_all:
        - community.example_staff
      require_any:
        - role.example_officer
    assertions:
      - Replace this with a procedural fact for appropriately connected characters.
    epistemic_type: fact
    confidence: 0.9
    source: Example staff handbook
