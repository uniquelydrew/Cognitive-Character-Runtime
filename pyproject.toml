[project]
name = "cognitive-character-runtime"
version = "0.1.0"
description = "Three-part synthetic cognition runtime for persistent characters"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: launches the local service graph over HTTP"]
