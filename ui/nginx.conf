worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    # Nginx runs as its unprivileged image user. All temporary proxy and request
    # data stays in the Compose-provided tmpfs rather than the immutable image.
    client_body_temp_path /tmp/client_body 1 2;
    proxy_temp_path /tmp/proxy 1 2;
    fastcgi_temp_path /tmp/fastcgi 1 2;
    uwsgi_temp_path /tmp/uwsgi 1 2;
    scgi_temp_path /tmp/scgi 1 2;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        # Profile snapshots are accepted up to 5 MB by the application. JSON
        # wrapping adds modest overhead, so keep the gateway limit deliberately
        # above that contract instead of silently rejecting valid comparisons.
        client_max_body_size 6m;

        location /api/ {
            proxy_pass http://orchestrator:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # The token is injected server-side. It is never exposed to the browser.
            proxy_set_header X-API-Key ${API_AUTH_TOKEN};
            # A turn can involve parallel left/right inference followed by executive
            # inference. Keep the gateway open for that live-model path.
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 270s;
            send_timeout 270s;
        }

        location / {
            try_files $uri /index.html;
        }

        # Only the two audited, static inline application scripts are permitted.
        # Profile content is rendered with textContent, and cannot add executable
        # inline script even if a future renderer accidentally creates a script tag.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-lqq/ZhONTQJGEHGjuvUySxP5xiRRdU8t7iQWyvA3f40=' 'sha256-HWVuqhl7jdFnUJ+76TKq0X9G/Wx7PQJP6lgIXrd7ZEc='" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
